name: Update Public Repo
on: 
  push:
    branches:
      - master
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - name: Stats
        run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event. "
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - run: mkdir private_repo
      - run: cd private_repo
      - name: Checkout private repo
        uses: actions/checkout@v3
        with:
          repository: creativetimofficial/paper-dashboard-pro-laravel
          token: ${{ secrets.CT_TOKEN }}
          path: private_repo
      - name: Checkout public repo
        uses: actions/checkout@v3
        with:
          repository: creativetimofficial/ct-paper-dashboard-pro-laravel
          token: ${{ secrets.CT_TOKEN }}
          path: public_repo
      - name: Configure git and push to public folder
        working-directory: /home/runner/work/paper-dashboard-pro-laravel/paper-dashboard-pro-laravel/public_repo
        run: |
          ls -la
          cp /home/runner/work/paper-dashboard-pro-laravel/paper-dashboard-pro-laravel/private_repo/README.md /home/runner/work/paper-dashboard-pro-laravel/paper-dashboard-pro-laravel/public_repo/README.md
          cp /home/runner/work/paper-dashboard-pro-laravel/paper-dashboard-pro-laravel/private_repo/CHANGELOG.md /home/runner/work/paper-dashboard-pro-laravel/paper-dashboard-pro-laravel/public_repo/CHANGELOG.md
          git config --global user.name "CI Bot"
          git config --global user.email "team@mupdivision.com"
          git add .
          git commit -m "Update files"
          git push origin HEAD:master --force
        shell: bash
      - run: echo "The fork was updated"   