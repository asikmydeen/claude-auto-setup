languageCode: en
title: Soft UI Flowbite PRO
baseURL: .
enableInlineShortcodes: true
canonifyURLs: true
params:
  authors: Creative Tim
  social_image_path: /windster-pro/images/og-image.jpg
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: colorful
  tableOfContents:
    startLevel: 2
    endLevel: 6
buildDrafts: true
buildFuture: true
enableRobotsTXT: true
metaDataFormat: yaml
disableKinds:
  - "404"
  - taxonomy
  - taxonomyTerm
  - RSS
publishDir: build
